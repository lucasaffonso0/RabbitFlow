# Full name of the release to be used in the chart. If set, overrides the default name generated by Helm.
fullnameOverride: rabbitflow

# Number of replicas for the deployment. Ignored if autoscaling is enabled.
replicaCount: 1

image:
  # Container image repository
  repository: <your-registry>/rabbitflow
  # Image pull policy: Always, IfNotPresent, Never
  pullPolicy: IfNotPresent
  # Image tag. If not set, uses .Chart.AppVersion
  tag: "1.0.0"

livenessProbe:
  # Enable or disable the livenessProbe
  enabled: true
  # HTTP probe configuration
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 3

readinessProbe:
  # Enable or disable the readinessProbe
  enabled: true
  # HTTP probe configuration
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3

service:
  # Kubernetes service type: ClusterIP, NodePort, LoadBalancer
  type: ClusterIP
  # Port exposed externally
  port: 4100
  # Port the container is listening on
  containerPort: 4100

clusterIssuer:
  # Enable ClusterIssuer creation
  enabled: false
  # ClusterIssuer name
  name: letsencrypt-prod
  # Email used for Let's Encrypt registration
  email: example@gmail.com
  # ACME production endpoint
  server: https://acme-v02.api.letsencrypt.org/directory
  gateway:
    # Gateway name used for validation
    name: shared-gateway
    # Gateway namespace
    namespace: nginx-gateway

gateway:
  # Enable Gateway creation (disable in other releases)
  enabled: false
  # GatewayClass to use
  gatewayClassName: nginx
  ### ClusterIssuer for automatic TLS
  #clusterIssuer: letsencrypt-prod
  # Gateway name (shared resource)
  name: shared-gateway
  # Gateway namespace
  namespace: nginx-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP

    - name: https
      hostname: "example.com.br"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          # Allow routes from all namespaces
          from: All
      tls:
        # TLS terminates at the Gateway
        mode: Terminate
        certificateRefs:
            # Reference kind
          - kind: Secret
            # TLS secret name
            name: example-tls

httproute:
  # Enable HTTPRoute creation
  enabled: false
  gateway:
      # Gateway name
    - name: shared-gateway
      # Gateway namespace
      namespace: nginx-gateway
      # HTTPS listener section
      sectionName: https
  # Hostname handled by this route
  hostnames:
    - example.com.br

autoscaling:
  # Enable or disable the HorizontalPodAutoscaler
  enabled: false
  # Minimum number of replicas
  minReplicas: 1
  # Maximum number of replicas
  maxReplicas: 3
  # CPU utilization percentage that triggers autoscaling
  targetCPUUtilizationPercentage: 80

# Schedule pods on specific nodes
nodeSelector: {}
# Tolerations for node taints
tolerations: []
# Pod affinity rules
affinity: {}

# Extra annotations for pods
podAnnotations: {}
# Extra labels for pods
podLabels: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# PersistentVolumeClaim created by the chart (mounted via volumes/volumeMounts)
pvc:
  enabled: true
  name: rabbitflow-data
  # "" = cluster default, "-" = no StorageClass
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  # Keep the PVC on helm uninstall
  keep: true

# List of additional volumes to be mounted into the Pod
volumes:
  - name: data
    persistentVolumeClaim:
      claimName: rabbitflow-data
# List of additional volume mounts for the container
volumeMounts:
  - name: data
    mountPath: /data

# Container resource requests and limits
resources:
  enabled: true
  requests:
    cpu: "50m"
    memory: "128Mi"    # 128 MB memory
  limits:
    cpu: "500m"
    memory: "256Mi"

# ConfigMap to be injected via envFrom
configmap:
  enabled: true
  configMapName: rabbitflow-config
  data:
    SESSION_DAYS: "7"
    # "1" behind HTTPS
    COOKIE_SECURE: "0"
    TRUST_PROXY: "0"

# Secret to be injected via envFrom
secret:
  enabled: false # Enable secret usage
  create: false # If true, creates the secret with the data below

serviceAccount:
  create: false
  name: secretsmanager-sa
  annotations:
    # IAM Role ARN associated via IRSA (EKS) that allows read access to AWS Secrets Manager
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/Secrets-manager-read-role

# Remote secrets configuration (e.g., AWS Secrets Manager)
secretsremote:
  # Enables remote secrets integration
  enabled: false
  # List of secrets to be consumed
  secrets:
    - awsSecretName: sonarqube
      # Keys to be extracted from the secret
      keys:
        - sonartoken
        - host
