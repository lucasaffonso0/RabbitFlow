{{- if .Values.pvc.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.pvc.name }}
  labels:
    {{- include "base.labels" . | nindent 4 }}
  {{- if .Values.pvc.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.pvc.accessModes | nindent 4 }}
  {{- if .Values.pvc.storageClass }}
  storageClassName: {{ if eq "-" .Values.pvc.storageClass }}""{{ else }}{{ .Values.pvc.storageClass | quote }}{{ end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.pvc.size | quote }}
{{- end }}
